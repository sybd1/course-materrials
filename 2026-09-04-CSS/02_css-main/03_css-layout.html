<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레이아웃</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container {
            border: 3px solid black;
        }

        .item {
            /* width: ;   */
            color: aliceblue;
            padding: 10px;
            text-align: center;
        }

        .red {
            background-color: red;
        }

        .green {
            background-color: green;
        }

        .blue {
            background-color: blue;
        }

        /* 
            flex는 한 방향으로 요소를 배치할 떄 많이 사용
            예를 들어 메뉴를 가로로 나열하거나, 버튼들을 한줄로 정렬할 때 유용하다
            주축 방향의 정렬은 justify-content, 교차축의 방향의 정렬은 align-items로 조절한다.
         */

        .flex-container {
            display: flex;
            justify-content: space-between;
            height: 150px;
            align-items: center;
            flex-wrap: wrap;
            /* 공간이 부족하면 다음 줄로 내려가게 함 */
        }

        .grid-container {
            display: grid;
            /* 사용 가능한 공간을 1:1:1 비율로 나눈 3개의 열을 만듦 */
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .grid-container .item:first-child {
            grid-column: 1 / 3;
        }

        .position-container {
            /* 
                position: relative는 현재 요소를 '위치 기준점'으로 만들 때 사용할 수 있다.
                부모에게 relative를 주고, 자식에서 absolute를 주면
                자식 요소를 부모 영역 안에서 원하는 위치에 배치할 수 있다.
             */
            position: relative;
            height: 200px;
        }

        .position-container .blue {
            /* 
                position: absolute가 적용된 요소의 자리를 다른 요소들이 비워두지 않기 때문에
                원하는 위치에 겹쳐 배치할 수 있지만, 남용하면 화면 구조가 흐트러질 수 있으니
                필요한 경우에만 사용하는 것이 좋다.
            */
            /* 부모와 상관 없이, 부모를 기준으로 자식을 원하는 위치로 옮길 수 있는 배치 */
            position: absolute;
            top: 50px;
            left: 50px;
            width: 100px;
            height: 100px;

        }

        .position-container .green {
            position: absolute;
            top: 65px;
            left: 65px;
            width: 100px;
            height: 100px;
        }
    </style>
</head>

<body>
    <h1>1. Flexbox로 배치하기 (가장 많이 사용!)</h1>
    <div class="container flex-container">
        <div class="item red">Item 1</div>
        <div class="item green">Item 2</div>
        <div class="item blue">Item 3</div>
        <div class="item red">Item 4</div>
        <div class="item green">Item 5</div>
    </div>

    <h1>Grid로 배치하기</h1>
    <div class="container grid-container">
        <div class="item red">Item 1</div>
        <div class="item green">Item 2</div>
        <div class="item blue">Item 3</div>
        <div class="item red">Item 4</div>
        <div class="item green">Item 5</div>
    </div>

    <h1>Position으로 배치하기</h1>
    <div class="container position-container">
        <div class="item blue">Absolute Position</div>
        <div class="item green">Absolute Position</div>
    </div>
</body>

</html>
