<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택자</title>
    <link rel="stylesheet" href="style.css">
    <!-- 
        CSS 적용하는 방법
        1. 태그에 직접 작성하는 인라인 스타일
        2. head 안에 style 태그로 작성하는 내부 스타일 시트
        3. 별도의 .css 파일을 연결하는 외부 스타일 시트

        같은 요소에 여러 스타일이 동시에 적용되면,
        태그 < 클래스 < 아이디 순으로 우선순위가 높아진다.
    -->
    <!-- <style>
        /* CSS 기본 문법
        선택자 {
            속성: 값; 
        }*/

        /* 태그 선택자 : HTML 태그 이름을 그대로 사용 */
        h2 {
            color: red;
        }

        /* 클래스 선택자: 점(.)으로 시작. 여러 요소에 '별명'을 붙여 그룹으로 꾸밀 때 사용*/
        .highlight-text {
            background-color: beige;
        }

        /* 아이디 선택자: 샵(#)으로 시작. 페이지에서 '단 하나뿐인' 요소에 '이름표' 붙일때 사용 */
        #blue-text {
            color: blue;
        }

        /* 후손 선택자: 띄어쓰기로 구분. 특정 요소 '안에 있는' 모든 후손 선택 */
        #lecture-list li {
            font-weight: bold;
        }

        /* 자손 선택자: > 기호로 구분. 특정 요소의 '바로 아래 자식'만 선택 */
        body > p {
            font-size: 30px;
        }

        /* 속성 선택자: 특정 속성이나 속성값을 가진 요소를 선택 */
        input[type="text"] {
            border: 2px solid orange;
        }

        /* 인접 형제 선택자: 바로 뒤에 이어지는 형제 요소를 선택 */
        input[type="radio"]:checked + label {
            font-weight: bold;
            color: blueviolet;
        }
    </style> -->
       
</head>
<body>
    <h1>CSS 선택자</h1>
    <p>CSS는 HTML 뼈대에 디자인 옷을 입히는 언어이다. 내가 꾸미고 싶은 대상을 정확히 '선택'하는 것이 가장 중요하다.</p>

    <h2>오늘의 강의 목록</h2>
    <ul id="lecture-list">
        <li>태그 선택자</li>
        <li class="highlight-text">클래스 선택자</li>
        <li id="blue-text">아이디 선택자</li>
        <li class="highlight-text">후손/자손 선택자</li>        
    </ul>

    <p style="color:green; font-style: italic;">이 문단은 CSS를 이용해 수업 중에 직접 꾸며볼 예정입니다.</p>

    <h2>폼 요소 선택하기</h2>
    <form action="#">
        <input type="text" placeholder="텍스트 입력창">
        <input type="number" placeholder="숫자 입력창">

        <p>선호 과목</p>
        <input type="radio" id="subject-html" name="subject" value="html" checked>
        <label for="subject-html">HTML</label>
        <input type="radio" id="subject-css" name="subject" value="css">
        <label for="subject-css">CSS</label>
    </form>
</body>
</html>
