<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레이아웃과 시맨틱</title>
    <style>
        div, span { border: 1px solid red;}
    </style>
</head>
<body>
    <h1>영역을 나누는 기본 태그: div와 span</h1>

    <h2>div태그(블럭 레벨 요소)</h2>
    <!-- division, 영역을 나눈다는 뜻. 한 '줄'을 통째로 차지 -->
    <div>첫 번째 div 요소입니다.</div>
    <div>두 번째 div 요소입니다.</div>

    <h2>span태그(인라인 요소)</h2>
    <!-- span: 특정 범위를 지정한다는 뜻. '콘텐츠 크기만큼'의 공간만 차지 -->
    <span>첫 번째 span 영역 입니다.</span>
    <span>두 번째 span 영역 입니다.</span>

    <hr>

    <h2>의미를 담아 영역 나누기: 시맨틱 태그</h2>
    <!-- header: 페이지나 특정 구역의 '머리말'을 의미(로고, 제목, 메뉴) -->
    <header>
        <h1>My Profile Page</h1>
        <nav>
            <a href="#intro">소개</a>
            <a href="#skills">보유 기술</a>
        </nav>
    </header>
    <!-- main 태그는 이 문서의 핵심 내용을 담는 영역이다. -->
     <main>
        <section id="intro">
            <h2>소개</h2>
            <p>안녕하세요! 예비 개발자 홍길동입니다!</p>
        </section>
        <section id="skills">
            <h2>보유 기술</h2>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
            </ul>
        </section>
     </main>
     <footer>
        <p>Copyright 2026 Gildong Hong.</p>
     </footer>
</body>
</html>
