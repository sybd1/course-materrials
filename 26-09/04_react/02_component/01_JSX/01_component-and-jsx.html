<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        /** 
         * 컴포넌트란?
         * UI를 재사용 가능한 '부품' 으로 나눈 것(ex. 헤더, 버튼, 카드)
         * React 엘리먼트를 반환하는 '자바스크립트 함수'이다.
         * 반드시 '대문자'로 시작해야 한다
         * 
         * 
         * 클래스형 컴포넌트, 컴포넌트는 앞 글자를 반드시 대문자로 시작
         * 자바스크립트의 class 문법을 사용하고, React.Component를 상속 받아 만든다.
        */
        class TitleClass extends React.Component {
            // 반드시 render() 함수 구현해야 함
            render() {
                return React.createElement('h1',
                    { className: 'classComponent' },
                    "클래스형 컴포넌트입니다."
                )
            }
        }

        /**
         * 함수형 컴포넌트
         */
        function OldWay() {
            return React.createElement(
                'div', null,
                React.createElement('h1', { className: 'greeting' }, "createElement 방식"),
                React.createElement('p', null, '코드가 길고 복잡해요.')
            );
        }

        //JSX 방식
        function NewWay() {
            return (
                <div>
                    <h1 className='greeting'>JSX방식</h1>
                    <p>HTML처럼 보여서 훨씬 직관적이다!!</p>
                </div>
            );
        }

        // 컴포넌트 합성
        function App() {
            return (
                // JSX에서 여러 태그를 반환할 때는 반드시 하나의 부모 요소로 감싸야 한다.
                // 여러 요소를 하나로 묶어주기 위한 특별한 빈 태그(Fragment)
                <>
                    <OldWay />
                    <hr/>
                    <NewWay />
                </>
            )
        }

                    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
