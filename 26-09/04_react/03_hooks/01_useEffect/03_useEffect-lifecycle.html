<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">

        const { useState, useEffect } = React;

        function Counter() {

            const [count, setCount] = useState(0);
            const [otherCount, setOtherCount] = useState(0);

            // 일단 첫 마운트 시점에는 무조건 한 번 동작

            // 1. 의존성 배열 생략 : 매 렌더링마다 실행
            useEffect(() => {
                console.log('렌더링 될 때마다 실행');
            })

            // 2. 빈 의존성 배열 [] : Mount(첫 렌더링) 시에만 실행
            // 주로 초기 데이터 로딩(API 호출) 등에 사용
            useEffect(() => {
                console.log('컴포넌트가 처음 화면에 나타남(mount)');
            }, []);

            // 3. 의존성 배열에 특정 값 지정
            useEffect(() => {
                console.log(`count값이 ${count}로 변경되어, 이 useEffect가 실행`);
            }, [count])

            console.log('Counter 컴포넌트 렌더링');

            return (
                <>
                    <h2>단순 카운터</h2>
                    <p>{count}번 클릭 했습니다.</p>
                    <button onClick={() => setCount(count + 1)}>+1</button>
                    <p>other count: {otherCount}</p>
                    <button onClick={() => setOtherCount(otherCount + 1)}>+1</button>
                </>
            )
        }

        function Timer () {

            useEffect(() => {
                console.log('타이머가 시작되었습니다.(Mount)');

                const timerId = setInterval(() => {
                    console.log('...1초 경과...');
                }, 1000)

                // cleanup 함수: useEffect가 반환하는 함수
                // 컴포넌트가 화면에서 사라지기 직전(Unmount)에 호출된다
                // 의존성이 바뀌어 재실행하는 경우에는 이전 작업을 정리하고 새 값으로 작업을 시작한다.
                return () => {
                    console.log('타이머를 정리합니다(Unmount)');
                    clearInterval(timerId);     // 생성했던 타이머 제거
                }
            }, []);

            return (
                <>
                <h3>타이머가 동작 중입니다.(콘솔을 확인하세요)</h3>
                </>
            )
        }

        function App() {
                const [showTimer, setShowTimer] = useState(true);
            return (
                <>
                    <Counter />
                    <hr/>
                    <button onClick={() => setShowTimer(!showTimer)}>타이머 보이기/숨기기</button>
                    {showTimer && <Timer/>}
                </>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>

</body>

</html>
