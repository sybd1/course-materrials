<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>

<body>
    <div id="root"></div>

    <script type="text/babel">

        const { useState, useEffect } = React;

        const API_KEY ='776ac9802aa53ec7389f6e2aa4b2bc5b'

        function Weather() {
            const [weatherData, setWeatherData] = useState(null);
            const [loading, setLoading] = useState(null);
            const [error, setError] = useState(null);

            useEffect(() => {
                const getPosition = () => {
                    return new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject);
                    });
                }

                const fetchWhether = async () => {
                    try {
                        setLoading(true);
                        setError(null);

                        const position = await getPosition();
                        console.log(position);
                        const { latitude, longitude } = position.coords;

                        const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&appid=${API_KEY}&units=metric`);
                        console.log(response);

                        if (!response.ok) {
                            throw new Error('날씨 정보를 가져오는데 실패!');
                        }

                        const result = await response.json();
                        console.log(result);
                        setWeatherData(result);

                    } catch (error) {
                        console.error(error);
                        setError(error);
                    } finally {
                        setLoading(false);
                    }
                };

                fetchWhether();

            }, []);

            if (loading) {
                return <div>날씨 정보를 불러오는 중...</div>
            }
            if (error) {
                return <div>오류 발생: {error.message}</div>
            }

            if (!weatherData) {
                return <div>날씨 정보 없음</div>
            }

            return (
                <>
                    <h1>{weatherData.name}의 날씨</h1>
                    <h4>{`날씨 : ${weatherData.weather[0].main}`}</h4>
                    <h4>{`현재 온도: ${weatherData.main.temp}`}</h4>
                    <h4>{`체감 온도: ${weatherData.main.feels_like}`}</h4>
                    <h4>{`풍속: ${weatherData.wind.speed}`}</h4>
                </>
            )
        }


        function App() {
            return (
                <>
                    <h1>오늘의 날씨</h1>
                    <Weather />
                </>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>

</body>

</html>
