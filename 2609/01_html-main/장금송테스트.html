<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,
        td,
        th,
        tr {
            border: 3px solid #000;
            border-collapse: collapse;
        }

        td,
        th {
            text-align: center;
        }
    </style>
</head>


<body>
    <h2>장금송이 보고있어</h2>
    <form action="">
        <feildset>
            <legend>장금송이</legend>
            <label for="text-name">이름:</label>
            <input type="text" id="text-name" name="name" placeholder="이름을 입력하세요">
            <br>
            <label for="text-pw">몸무게:</label>
            <input type="text" id="text-pw" name="pw" placeholder="몸무게를 입력하세요">
            <br>
            <label for="age">나이:</label>
            <select name="age" id="age">
                <option value="">나이를 선택하세요</option>
                <option value="10">10대</option>
                <option value="20">20대</option>
                <option value="30">30대</option>
                <option value="40">40대</option>
                <option value="50">50대 이상</option>
            </select>
        </feildset>
    </form>
    <br>
    <table>
        <caption>대가리</caption>
        <thead>
            <tr>
                <th>00</th>
                <th>00</th>
                <th>00</th>
                <th>00</th>
                <th>00</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="5">--^_^--</td>
            </tr>
        </tbody>
    </table>
    <br>
    <p>뭐 먹을래?</p>

    <button type="submit" id="he-d-k" name="food" value="bacon">
        <label for="he-d-k">베이컨</label>
    </button>
    <hr>
    <div>
        <p>선택</p>
        <span>            
            <input id="family-c" name="family" value="brother" type="radio" checked>
            <label for="family-c">형</label>
        </span>
        <span>
            <input id="family-f" name="family" value="frog" type="radio">
            <label for="family-f">개구리</label>
        </span>
    </div>
</body>




</html>
